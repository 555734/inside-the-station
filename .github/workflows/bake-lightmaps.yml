# Bakes the walkthrough app's lightmaps (scripts/apk/export_station.py) on up to 20 runners at once.
# Started by a push that changes .github/bake/request.json: the layout every runner must rebuild
# (its id) and the chunks each runner bakes (one runner per entry of "parts"). With "prep_run",
# the runners take the prepared layout of that earlier run instead of preparing it again;
# "close_extra" adds closure geometry made since, and "expect_layout" is the layout id the
# runners must arrive at before they bake.
# Raw lightmaps come back as artifacts (raw-<part>); scripts/apk/finish_station.py denoises them.
# The official map is fetched on each runner and never stored in an artifact.
name: bake-lightmaps
on:
  push:
    paths: [".github/bake/request.json"]
permissions:
  contents: read
  actions: read
env:
  EXPORT_ARGS: --samples 128 --texel 0.03 --max-lm 2048 --max-tex 1024

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.p.outputs.parts }}
      prep_run: ${{ steps.p.outputs.prep_run }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open(".github/bake/request.json"))
          print("parts=" + json.dumps(list(range(1, len(r["parts"]) + 1))))
          print("prep_run=" + str(r.get("prep_run", "")))
          PY

  prep:
    needs: plan
    if: needs.plan.outputs.prep_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: system packages
        run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils libxi6 libxkbcommon0 libxxf86vm1 libsm6 libgl1 libxrender1 libxfixes3 > /dev/null
      - name: python packages
        run: pip install -q bpy==5.3.0 numpy scipy pillow opencv-python-headless
      - name: map plan and fonts
        run: |
          bash scripts/umeda/fetch_map.sh
          python scripts/umeda/plan.py
          bash scripts/fetch_fonts.sh > /dev/null
      - name: layout (textures are generated on the way)
        run: python scripts/apk/export_station.py /tmp/layout $EXPORT_ARGS --layout-only
      - name: same layout as the other bakes
        run: |
          python - <<'PY'
          import json, sys
          want = json.load(open(".github/bake/request.json"))["layout"]
          got = json.load(open("/tmp/layout/uv/index.json"))["layout_id"]
          print("layout", got, "expected", want)
          sys.exit(0 if got == want else 1)
          PY
      - name: pack
        run: tar -cf /tmp/prep.tar --exclude='cache/umeda/*.pdf' --exclude='cache/umeda/map*' --exclude='cache/umeda/page*' cache fonts -C /tmp layout/uv
      - uses: actions/upload-artifact@v4
        with: {name: prep, path: /tmp/prep.tar, retention-days: 1, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: probe, path: /tmp/layout/uv/index.json, retention-days: 1}

  bake:
    needs: [plan, prep]
    if: always() && needs.plan.result == 'success' && (needs.prep.result == 'success' || needs.prep.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: system packages
        run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils libxi6 libxkbcommon0 libxxf86vm1 libsm6 libgl1 libxrender1 libxfixes3 > /dev/null
      - name: python packages
        run: pip install -q bpy==5.3.0 numpy scipy pillow opencv-python-headless
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: /tmp
          run-id: ${{ needs.plan.outputs.prep_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: unpack, map and plan
        run: |
          tar -xf /tmp/prep.tar
          mv layout /tmp/layout
          python - <<'PY'
          import json, sys
          want = json.load(open(".github/bake/request.json"))["layout"]
          got = json.load(open("/tmp/layout/uv/index.json"))["layout_id"]
          print("layout", got, "expected", want)
          sys.exit(0 if got == want else 1)
          PY
          # closure added since that layout was prepared (chunks it touches are laid out again,
          # the same way on every machine; expect_layout below confirms it)
          python - <<'PY'
          import json
          r = json.load(open(".github/bake/request.json"))
          if "close_extra" in r:
              p = "/tmp/layout/uv/index.json"
              i = json.load(open(p))
              i["close"].update(r["close_extra"])
              json.dump(i, open(p, "w"))
              print("closure extended:", {k: len(v) for k, v in r["close_extra"].items()})
          PY
          bash scripts/umeda/fetch_map.sh
          python scripts/umeda/plan.py
      - name: bake this part
        run: |
          SKIP=$(python -c "import json,sys; r=json.load(open('.github/bake/request.json')); i=json.load(open('/tmp/layout/uv/index.json')); mine=set(r['parts'][int(sys.argv[1])-1]); print(','.join(sorted(set(i['sizes'])-mine)))" ${{ matrix.part }})
          WANT=$(python -c "import json; print(json.load(open('.github/bake/request.json')).get('expect_layout', ''))")
          python scripts/apk/export_station.py /tmp/station $EXPORT_ARGS --uv-from /tmp/layout/uv \
            --raw-dir /tmp/raw --skip "$SKIP" --reverse --deadline $(( $(date +%s) + 18600 )) > /tmp/export.log 2>&1 &
          PID=$!
          if [ -n "$WANT" ]; then
            until grep -q " layout [0-9a-f]\{12\}" /tmp/export.log || ! kill -0 $PID 2>/dev/null; do sleep 5; done
            grep " layout [0-9a-f]\{12\}" /tmp/export.log | tail -1
            if ! grep -q " layout $WANT" /tmp/export.log; then echo "layout is not $WANT"; kill $PID; cat /tmp/export.log | tail -40; exit 1; fi
          fi
          st=0; wait $PID || st=$?
          grep -v "^Info:" /tmp/export.log | tail -30
          mkdir -p /tmp/raw/uv
          for c in $(python -c "import json,sys; print(' '.join(json.load(open('.github/bake/request.json'))['parts'][int(sys.argv[1])-1]))" ${{ matrix.part }}); do
            cp /tmp/station/uv/$c.npz /tmp/raw/uv/ 2>/dev/null || true
          done
          cp /tmp/station/uv/index.json /tmp/raw/uv/ 2>/dev/null || true
          exit $st
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "raw-${{ matrix.part }}", path: /tmp/raw/, retention-days: 3, compression-level: 0, if-no-files-found: ignore}
