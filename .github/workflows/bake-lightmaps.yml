# Bakes the walkthrough app's lightmaps (scripts/apk/export_station.py) on up to 20 runners at once.
# Started by a push that changes .github/bake/request.json: the layout every runner must rebuild
# (its id) and the chunks each runner bakes (one runner per entry of "parts"). With "prep_run",
# the runners take the prepared layout of that earlier run instead of preparing it again;
# "close_extra" adds closure geometry made since, and "expect_layout" is the layout id the
# runners must arrive at before they bake.
# Raw lightmaps come back as artifacts (raw-<part>); scripts/apk/finish_station.py denoises them.
# The official map is fetched on each runner and never stored in an artifact.
name: bake-lightmaps
on:
  push:
    paths: [".github/bake/request.json"]
permissions:
  contents: read
  actions: read
env:
  EXPORT_ARGS: --samples 128 --texel 0.03 --max-lm 2048 --max-tex 1024 --batch-px 3000000

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.p.outputs.parts }}
      prep_run: ${{ steps.p.outputs.prep_run }}
      base_prep_run: ${{ steps.p.outputs.base_prep_run }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open(".github/bake/request.json"))
          n = r["auto_parts"] if "auto_parts" in r else len(r["parts"])
          print("parts=" + json.dumps(list(range(1, n + 1))))
          print("prep_run=" + str(r.get("prep_run", "")))
          print("base_prep_run=" + str(r.get("base_prep_run", "")))
          PY

  prep:
    needs: plan
    if: needs.plan.outputs.prep_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: system packages
        run: (sudo apt-get -qq update || true) && sudo apt-get -qq install -y poppler-utils libxi6 libxkbcommon0 libxxf86vm1 libsm6 libgl1 libxrender1 libxfixes3 > /dev/null
      - name: python packages
        run: pip install -q bpy==5.3.0 numpy scipy pillow opencv-python-headless
      # with base_prep_run: that run's layout (and textures, fonts) is the start; only the chunks
      # whose geometry changed since are laid out again, here once for every bake and the app
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.base_prep_run != ''
        with:
          name: prep
          path: /tmp/base
          run-id: ${{ needs.plan.outputs.base_prep_run }}
          github-token: ${{ github.token }}
      - name: map plan and fonts
        run: |
          if [ -f /tmp/base/prep.tar ]; then tar -xf /tmp/base/prep.tar && mv layout /tmp/base_layout; fi
          bash scripts/umeda/fetch_map.sh
          python scripts/umeda/plan.py
          bash scripts/fetch_fonts.sh > /dev/null
      - name: layout (textures are generated on the way)
        run: |
          if [ -d /tmp/base_layout/uv ]; then
            python scripts/apk/export_station.py /tmp/layout $EXPORT_ARGS --layout-only --uv-from /tmp/base_layout/uv > /tmp/layout.log 2>&1 || { tail -40 /tmp/layout.log; exit 1; }
            grep -E "laid out anew| layout [0-9a-f]{12}" /tmp/layout.log | cut -c1-400
          else
            python scripts/apk/export_station.py /tmp/layout $EXPORT_ARGS --layout-only
          fi
      - name: same layout as the other bakes
        run: |
          python - <<'PY'
          import json, sys
          want = json.load(open(".github/bake/request.json")).get("layout")
          got = json.load(open("/tmp/layout/uv/index.json"))["layout_id"]
          print("layout", got, "expected", want or "(this one: every bake and the app use it)")
          sys.exit(0 if want in (None, got) else 1)
          PY
      - name: pack
        run: tar -cf /tmp/prep.tar --exclude='cache/umeda/*.pdf' --exclude='cache/umeda/map*' --exclude='cache/umeda/page*' cache fonts -C /tmp layout/uv
      - uses: actions/upload-artifact@v4
        with: {name: prep, path: /tmp/prep.tar, retention-days: 1, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: probe, path: /tmp/layout/uv/index.json, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: layout_uv, path: /tmp/layout/uv/, retention-days: 7, compression-level: 6}

  bake:
    needs: [plan, prep]
    if: always() && needs.plan.result == 'success' && (needs.prep.result == 'success' || needs.prep.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: system packages
        run: (sudo apt-get -qq update || true) && sudo apt-get -qq install -y poppler-utils libxi6 libxkbcommon0 libxxf86vm1 libsm6 libgl1 libxrender1 libxfixes3 > /dev/null
      - name: python packages
        run: pip install -q bpy==5.3.0 numpy scipy pillow opencv-python-headless
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: /tmp
          run-id: ${{ needs.plan.outputs.prep_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: unpack, map and plan
        run: |
          tar -xf /tmp/prep.tar
          mv layout /tmp/layout
          python - <<'PY'
          import json, sys
          want = json.load(open(".github/bake/request.json")).get("layout")
          got = json.load(open("/tmp/layout/uv/index.json"))["layout_id"]
          print("layout", got, "expected", want or "(the one prepared in this run)")
          sys.exit(0 if want in (None, got) else 1)
          PY
          # closure added since that layout was prepared (chunks it touches are laid out again,
          # the same way on every machine; expect_layout below confirms it)
          python - <<'PY'
          import json
          r = json.load(open(".github/bake/request.json"))
          if "close_extra" in r:
              p = "/tmp/layout/uv/index.json"
              i = json.load(open(p))
              i["close"].update(r["close_extra"])
              json.dump(i, open(p, "w"))
              print("closure extended:", {k: len(v) for k, v in r["close_extra"].items()})
          PY
          bash scripts/umeda/fetch_map.sh
          python scripts/umeda/plan.py
      - name: bake this part
        run: |
          python - ${{ matrix.part }} > /tmp/mine.txt <<'PY'
          import json, sys
          r = json.load(open(".github/bake/request.json"))
          sizes = json.load(open("/tmp/layout/uv/index.json"))["sizes"]
          part = int(sys.argv[1])
          if r.get("bake_changed"):
              # one chunk laid out anew in the prep per runner (none left: nothing to do)
              ch = sorted(json.load(open("/tmp/layout/uv/index.json")).get("changed", []))
              mine = ch[part - 1:part]
          elif "auto_parts" in r:
              # largest first into the lightest bin: every runner gets about the same pixels;
              # "bake_set": only chunks whose name starts with one of these (others keep theirs);
              # "elsewhere": chunks baked on other machines (Kaggle, local)
              n = r["auto_parts"]
              bins = [[0, []] for _ in range(n)]
              pick = [c for c in sizes if (not r.get("bake_set") or any(c.startswith(p) for p in r["bake_set"]))
                      and c not in set(r.get("elsewhere", []))]
              for name in sorted(pick, key=lambda c: (-sizes[c] ** 2, c)):
                  b = min(range(n), key=lambda i: (bins[i][0], i))
                  bins[b][0] += sizes[name] ** 2
                  bins[b][1].append(name)
              mine = bins[part - 1][1]
          else:
              mine = r["parts"][part - 1]
          print(",".join(mine))
          PY
          echo "chunks: $(cat /tmp/mine.txt)"
          if [ -z "$(tr -d '[:space:]' < /tmp/mine.txt)" ]; then echo "no chunk for this runner"; exit 0; fi
          SKIP=$(python -c "import json,sys; i=json.load(open('/tmp/layout/uv/index.json')); mine=set(open('/tmp/mine.txt').read().strip().split(',')); print(','.join(sorted(set(i['sizes'])-mine)))")
          WANT=$(python -c "import json; r=json.load(open('.github/bake/request.json')); print(r.get('expect_layout') or r.get('layout') or json.load(open('/tmp/layout/uv/index.json'))['layout_id'])")
          # the scene build has died now and then on a runner before the layout (4 of 20 runners
          # once): up to three attempts, with the log and the kernel's last words each time
          for attempt in 1 2 3; do
            python scripts/apk/export_station.py /tmp/station $EXPORT_ARGS --uv-from /tmp/layout/uv \
              --raw-dir /tmp/raw --skip "$SKIP" --reverse --deadline $(( $(date +%s) + 18000 )) > /tmp/export.log 2>&1 &
            PID=$!
            until grep -q " layout [0-9a-f]\{12\}" /tmp/export.log || ! kill -0 $PID 2>/dev/null; do sleep 5; done
            if grep -q " layout [0-9a-f]\{12\}" /tmp/export.log; then break; fi
            echo "attempt $attempt: the export ended before the layout"; grep -v "^Info:" /tmp/export.log | tail -25
            sudo dmesg 2>/dev/null | tail -8 || true
            free -m || true
          done
          if [ -n "$WANT" ]; then
            grep " layout [0-9a-f]\{12\}" /tmp/export.log | tail -1
            # (the whole layout's id may differ when chunks changed since; each of this runner's own
            # chunks is checked below)
            grep -q " layout $WANT" /tmp/export.log || echo "layout differs from $WANT (chunks changed since the prep)"
            # the chunks this runner bakes must keep the prepared UVs (one laid out again here would not
            # match); chunks changed since and baked elsewhere may be laid out anew
            if ! python3 - <<'PY'
          import re, sys
          line = [l for l in open("/tmp/export.log") if "laid out anew" in l][-1]
          anew = set(re.findall(r"'([^']+)'", line.split("laid out anew")[1]))
          mine = set(open("/tmp/mine.txt").read().strip().split(","))
          print("laid out anew:", sorted(anew), "of mine:", sorted(anew & mine))
          sys.exit(1 if anew & mine else 0)
          PY
            then echo "some of this runner's chunks were laid out again"; kill $PID 2>/dev/null || true; exit 1; fi
          fi
          st=0; wait $PID || st=$?
          grep -v "^Info:" /tmp/export.log | tail -30
          mkdir -p /tmp/raw/uv
          for c in $(tr ',' ' ' < /tmp/mine.txt); do
            cp /tmp/station/uv/$c.npz /tmp/raw/uv/ 2>/dev/null || true
          done
          cp /tmp/station/uv/index.json /tmp/raw/uv/ 2>/dev/null || true
          exit $st
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "raw-${{ matrix.part }}", path: /tmp/raw/, retention-days: 3, compression-level: 0, if-no-files-found: ignore}
